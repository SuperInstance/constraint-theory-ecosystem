name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  golden-vectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: ruby/setup-ruby@v1
        with: { ruby-version: '3.3' }
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.3' }

      - name: Generate golden vectors
        run: python3 tools/generate_golden_vectors.py > tools/golden_vectors.json

      - name: Python
        run: python3 tools/test_golden.py

      - name: JavaScript
        run: node tools/test_golden.js

      - name: Ruby
        run: ruby tools/test_golden.rb

      - name: PHP
        run: php tools/test_golden.php

  rust-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test
        run: |
          cd src/rust
          cargo test

  pages:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build Pages
        run: |
          mkdir -p _site
          cp docs/index.html _site/
      - uses: actions/upload-pages-artifact@v3
      - id: deploy
        uses: actions/deploy-pages@v4
