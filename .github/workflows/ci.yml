name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  PYTHON_DEFAULT_VERSION: '3.11'
  PHP_DEFAULT_VERSION: '8.2'

jobs:
  test-python:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']
      fail-fast: false

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/requirements*.txt', 'pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-${{ matrix.python-version }}-
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov pytest-benchmark
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
        if [ -f pyproject.toml ]; then pip install -e .; fi

    - name: Run tests with coverage
      run: |
        pytest --cov=flux_constraint --cov-report=xml --cov-report=term-missing --cov-fail-under=85 -v

    - name: Upload coverage to Codecov
      if: matrix.python-version == env.PYTHON_DEFAULT_VERSION
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: python
        name: codecov-python
        fail_ci_if_error: false

  test-php:
    name: Test PHP ${{ matrix.php-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.1', '8.2', '8.3']
      fail-fast: false

    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP ${{ matrix.php-version }}
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-version }}
        extensions: mbstring, curl, json
        coverage: xdebug
        tools: composer:v2

    - name: Validate composer.json and composer.lock
      run: composer validate --strict

    - name: Cache Composer dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/composer
        key: ${{ runner.os }}-composer-${{ matrix.php-version }}-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-composer-${{ matrix.php-version }}-
          ${{ runner.os }}-composer-

    - name: Install PHP dependencies
      run: |
        if [ -f composer.json ]; then
          composer install --prefer-dist --no-progress --no-suggest --optimize-autoloader
        fi

    - name: Run PHPUnit tests
      run: |
        if [ -f phpunit.xml ] || [ -f phpunit.xml.dist ]; then
          ./vendor/bin/phpunit --coverage-clover=coverage.xml --coverage-text --colors=never
        elif [ -d tests ]; then
          ./vendor/bin/phpunit tests --coverage-clover=coverage.xml --coverage-text --colors=never
        else
          echo "No PHPUnit configuration or tests directory found"
        fi

    - name: Upload PHP coverage to Codecov
      if: matrix.php-version == env.PHP_DEFAULT_VERSION
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: php
        name: codecov-php
        fail_ci_if_error: false

  lint:
    name: Code Quality & Linting
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_DEFAULT_VERSION }}

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ env.PHP_DEFAULT_VERSION }}
        tools: composer:v2

    - name: Cache Python dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-lint-${{ hashFiles('**/requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-lint-

    - name: Cache Composer dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/composer
        key: ${{ runner.os }}-composer-lint-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-composer-lint-

    - name: Install Python linting tools
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black isort mypy bandit safety
        if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

    - name: Install PHP dependencies for linting
      run: |
        if [ -f composer.json ]; then
          composer install --prefer-dist --no-progress
        fi

    - name: Python Code Formatting (Black)
      run: |
        if find . -name "*.py" -not -path "./venv/*" -not -path "./.venv/*" | head -1 | grep -q .; then
          black --check --diff .
        else
          echo "No Python files found to format"
        fi

    - name: Python Import Sorting (isort)
      run: |
        if find . -name "*.py" -not -path "./venv/*" -not -path "./.venv/*" | head -1 | grep -q .; then
          isort --check-only --diff .
        else
          echo "No Python files found to check imports"
        fi

    - name: Python Linting (flake8)
      run: |
        if find . -name "*.py" -not -path "./venv/*" -not -path "./.venv/*" | head -1 | grep -q .; then
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=88 --statistics
        else
          echo "No Python files found to lint"
        fi

    - name: Python Type Checking (mypy)
      run: |
        if find . -name "*.py" -not -path "./venv/*" -not -path "./.venv/*" | head -1 | grep -q .; then
          mypy . --ignore-missing-imports || true
        else
          echo "No Python files found for type checking"
        fi

    - name: Python Security Check (bandit)
      run: |
        if find . -name "*.py" -not -path "./venv/*" -not -path "./.venv/*" | head -1 | grep -q .; then
          bandit -r . -f json || true
        else
          echo "No Python files found for security checking"
        fi

    - name: Python Dependency Security Check
      run: |
        if [ -f requirements.txt ]; then
          safety check -r requirements.txt || true
        else
          echo "No requirements.txt found for dependency security check"
        fi

    - name: PHP Code Style (PHP_CodeSniffer)
      run: |
        if find . -name "*.php" -not -path "./vendor/*" | head -1 | grep -q .; then
          if [ -f ./vendor/bin/phpcs ]; then
            ./vendor/bin/phpcs --standard=PSR12 --extensions=php --ignore=vendor/ . || true
          else
            echo "PHPCS not installed, skipping PHP code style check"
          fi
        else
          echo "No PHP files found to check"
        fi

    - name: PHP Static Analysis (PHPStan)
      run: |
        if find . -name "*.php" -not -path "./vendor/*" | head -1 | grep -q .; then
          if [ -f ./vendor/bin/phpstan ]; then
            ./vendor/bin/phpstan analyse --level=5 . || true
          else
            echo "PHPStan not installed, skipping PHP static analysis"
          fi
        else
          echo "No PHP files found for static analysis"
        fi

  benchmark:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_DEFAULT_VERSION }}

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ env.PHP_DEFAULT_VERSION }}
        extensions: mbstring, curl, json
        tools: composer:v2

    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cache/pip
          ~/.cache/composer
        key: ${{ runner.os }}-benchmark-${{ hashFiles('**/requirements*.txt', '**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-benchmark-

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest-benchmark
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        if [ -f pyproject.toml ]; then pip install -e .; fi

    - name: Install PHP dependencies
      run: |
        if [ -f composer.json ]; then
          composer install --prefer-dist --no-progress --optimize-autoloader
        fi

    - name: Run Python benchmarks
      run: |
        if find . -name "*bench*.py" -o -name "*benchmark*.py" | head -1 | grep -q .; then
          pytest --benchmark-only --benchmark-json=python-benchmark.json || true
        else
          echo "No Python benchmark files found"
        fi

    - name: Run PHP benchmarks
      run: |
        if [ -f benchmark.php ]; then
          php benchmark.php > php-benchmark.txt
        elif find . -name "*bench*.php" -o -name "*benchmark*.php" | head -1 | grep -q .; then
          for file in $(find . -name "*bench*.php" -o -name "*benchmark*.php"); do
            echo "Running benchmark: $file"
            php "$file"
          done > php-benchmark.txt
        else
          echo "No PHP benchmark files found"
        fi

    - name: Upload benchmark results
      uses: actions/upload-artifact@v3
      with:
        name: benchmark-results-${{ github.sha }}
        path: |
          python-benchmark.json
          php-benchmark.txt
        retention-days: 30

    - name: Comment benchmark results on PR
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');

          let comment = '## 📊 Benchmark Results\n\n';

          // Python benchmarks
          if (fs.existsSync('python-benchmark.json')) {
            const pythonResults = JSON.parse(fs.readFileSync('python-benchmark.json', 'utf8'));
            comment += '### Python Benchmarks\n';
            if (pythonResults.benchmarks && pythonResults.benchmarks.length > 0) {
              comment += '| Test | Mean | Std Dev | Ops/sec |\n';
              comment += '|------|------|---------|--------|\n';
              pythonResults.benchmarks.forEach(bench => {
                const mean = (bench.stats.mean * 1000).toFixed(3);
                const stddev = (bench.stats.stddev * 1000).toFixed(3);
                const ops = (1 / bench.stats.mean).toFixed(0);
                comment += `| ${bench.name} | ${mean}ms | ${stddev}ms | ${ops} |\n`;
              });
            }
            comment += '\n';
          }

          // PHP benchmarks
          if (fs.existsSync('php-benchmark.txt')) {
            const phpResults = fs.readFileSync('php-benchmark.txt', 'utf8');
            comment += '### PHP Benchmarks\n';
            comment += '```\n' + phpResults + '\n```\n';
          }

          if (comment.length > 100) {
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
          }

  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: 'trivy-results.sarif'

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [test-python, test-php, lint]
    if: github.event_name == 'pull_request'

    services:
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_DEFAULT_VERSION }}

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ env.PHP_DEFAULT_VERSION }}
        extensions: mbstring, curl, json, redis
        tools: composer:v2

    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cache/pip
          ~/.cache/composer
        key: ${{ runner.os }}-integration-${{ hashFiles('**/requirements*.txt', '**/composer.lock') }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        if [ -f requirements-integration.txt ]; then pip install -r requirements-integration.txt; fi
        if [ -f composer.json ]; then composer install --prefer-dist --no-progress; fi

    - name: Run integration tests
      env:
        REDIS_URL: redis://localhost:6379
        INTEGRATION_TEST: true
      run: |
        if [ -d tests/integration ]; then
          pytest tests/integration/ -v --tb=short
        elif find . -name "*integration*.py" | head -1 | grep -q .; then
          pytest -k integration -v --tb=short
        else
          echo "No integration tests found"
        fi

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [test-python, test-php, lint, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: staging

    steps:
    - uses: actions/checkout@v4

    - name: Deploy to staging
      run: |
        echo "Deploying to staging environment..."
        # Add your deployment scripts here
        echo "Deployment completed successfully"

    - name: Run smoke tests
      run: |
        echo "Running smoke tests on staging..."
        # Add smoke test commands here
        echo "Smoke tests passed"

  notify:
    name: Notifications
    runs-on: ubuntu-latest
    needs: [test-python, test-php, lint, benchmark, security]
    if: always()

    steps:
    - name: Notify on failure
      if: |
        needs.test-python.result == 'failure' ||
        needs.test-php.result == 'failure' ||
        needs.lint.result == 'failure' ||
        needs.security.result == 'failure'
      run: |
        echo "CI pipeline failed. Notifications would be sent here."
        # Add notification logic (Slack, Discord, email, etc.)

    - name: Notify on success
      if: |
        needs.test-python.result == 'success' &&
        needs.test-php.result == 'success' &&
        needs.lint.result == 'success' &&
        needs.security.result == 'success'
      run: |
        echo "CI pipeline completed successfully."
        # Add success notification logic