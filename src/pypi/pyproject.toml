[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "flux-constraint"
version = "1.0.0"
description = "INT8 saturated constraint checking for safety-critical systems. Zero dependencies."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.8"
authors = [{name = "SuperInstance"}]
keywords = ["constraint", "safety", "int8", "formal-verification", "do-178c", "iso-26262", "embedded"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.urls]
Homepage = "https://superinstance.github.io/constraint-theory-ecosystem"
Repository = "https://github.com/SuperInstance/constraint-theory-ecosystem"
